<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Generator</title>
  <link rel="apple-touch-icon" sizes="180x180" href="Images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="Images/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="Images/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="Images/site.webmanifest">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quote-container" id="quote-container">
    <!-- Quote element -->
     <div class="quote-text">
      <i class="fa-solid fa-quote-left"></i>
      <i class="fa-solid fa-quote-right"></i>
      <h1>Inspiring quotes</h1>
      <span id="quote">“Be yourself; everyone else is already taken.”</span>
     </div>
     <!-- Author -->
     <div class="quote-author">
      <span id="author"> Oscar Wilde</span> 
     </div>
     <!-- Button -->
      <div class="button-container">
        <button class="twitter-button" id="twitter" title="Tweet this"><i class="fa-brands fa-square-twitter"></i>
        </button>
        <button class="new-quote" id="new-quote">New Quote</button>
      </div>
  </div> 
       <script src="script.js"></script>
      </body>
</html>
