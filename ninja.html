<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link rel="icon" type="image/png" sizes="32x32" href="Images/32x32favicon.png">
        <link rel="icon" type="image/png" sizes="16x16" href="Images/16x16favicon.png">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quote-container" id="quote-container">
    <!-- Quote element -->
     <div class="quote-text">
       <h1>"Inspiring quotes"</h1>
      <span id="quote">“Be yourself; everyone else is already taken.”</span>
     </div>
     <!-- Author -->
     <div class="quote-author">
      <span id="author"> Oscar Wilde</span> 
     </div>
     <!-- Button -->
      <div class="button-container">
        <button class="twitter-button" id="twitter" title="Tweet this"><i class="fa-brands fa-square-twitter"></i>
        </button>
        <button class="new-quote" id="new-quote">New Quote</button>
      </div>
  </div>
    
</body>
</html>
