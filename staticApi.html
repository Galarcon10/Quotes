<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Api nested in a github user</title>
        <link rel="icon" type="image/png" sizes="32x32" href="Images/32x32favicon.png">
        <link rel="icon" type="image/png" sizes="16x16" href="Images/16x16favicon.png">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quote-container" id="quote-container">
    <!-- Quote element -->
     <div class="quote-text">
       <h1>"Inspiring quotes"</h1>
      <div id="quote"></div>
     </div>
     <!-- Author -->
     <div class="quote-author">
      <span id="author"> </span> 
     </div>
     <!-- Button -->
      <div class="button-container">
          <button class="threads-button" id="threads" title="Thread this"><i class="fa-brands fa-square-threads"></i></button>
          <button class="twitter-button" id="twitter" title="Tweet this"><i class="fa-brands fa-square-twitter"></i></button>
          <a href="index.html" class="back-button" id="back-button">Back to main menu</a>
          <button class="new-quote" id="new-quote">New Quote</button>
      </div>
  </div> 
       <script src="script-static-api.js"></script>
</body>
</html>
